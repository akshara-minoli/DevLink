apiVersion: apps/v1
kind: Deployment
metadata:
  name: devlink-postgres
  labels:
    app: devlink-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devlink-postgres
  template:
    metadata:
      labels:
        app: devlink-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: devlink
            - name: POSTGRES_USER
              value: devlink
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devlink-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U devlink -d devlink
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U devlink -d devlink
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: devlink-postgres-data
