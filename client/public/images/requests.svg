<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="joinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9ff7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7a59;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- User incoming -->
  <circle cx="60" cy="70" r="20" stroke="url(#joinGrad)" stroke-width="3"/>
  <path d="M 50 95 Q 50 100 55 100 L 65 100 Q 70 100 70 95" stroke="url(#joinGrad)" stroke-width="3" fill="none"/>
  
  <!-- Arrow -->
  <path d="M 75 100 L 95 100" stroke="url(#joinGrad)" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="url(#joinGrad)"/>
    </marker>
  </defs>
  
  <!-- Project/circle -->
  <circle cx="140" cy="70" r="22" stroke="url(#joinGrad)" stroke-width="3"/>
  <line x1="130" y1="70" x2="150" y2="70" stroke="url(#joinGrad)" stroke-width="2"/>
  <line x1="140" y1="60" x2="140" y2="80" stroke="url(#joinGrad)" stroke-width="2"/>
  
  <!-- Request badge -->
  <circle cx="140" cy="105" r="12" fill="url(#joinGrad)" opacity="0.7"/>
  <text x="140" y="112" font-size="16" fill="white" text-anchor="middle" font-weight="bold">?</text>
  
  <!-- Check icons (approval) -->
  <g opacity="0.5">
    <circle cx="100" cy="150" r="10" stroke="url(#joinGrad)" stroke-width="2"/>
    <path d="M 96 150 L 98 152 L 104 148" stroke="url(#joinGrad)" stroke-width="2" fill="none"/>
  </g>
</svg>
